name: 15分毎のWeb自動化処理

on:
  schedule:
    # 日本時間（JST）月〜金の朝 8:00〜8:45（UTC 日〜木の 23:00〜23:45）
    - cron: '*/15 23 * * 0-4'
    # 日本時間（JST）月〜金の 9:00〜19:45（UTC 月〜金の 0:00〜10:45）
    - cron: '*/15 0-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Chromeブラウザのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gmail認証ファイルの生成
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: 自動化スクリプト実行
        env:
          BASIS_USERNAME: ${{ secrets.BASIS_USERNAME }}
          BASIS_PASSWORD: ${{ secrets.BASIS_PASSWORD }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WIKI_TOKEN: ${{ secrets.LARK_WIKI_TOKEN }}
          DEFAULT_SHEET_ID: ${{ secrets.DEFAULT_SHEET_ID }}
        run: |
          python main.py
